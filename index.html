<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./game/" />
    <title>CRUX SACRA</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #101927;
        color: #fff8d3;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        text-align: center;
      }

      a {
        color: #f8dc71;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CRUX SACRA</h1>
      <p>Opening the game...</p>
      <p><a id="gameLink" href="./game/">Tap here if it does not open automatically.</a></p>
    </main>
    <script>
      const target = new URL("./game/", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById("gameLink").href = target.href;
      window.location.replace(target.href);
    </script>
  </body>
</html>
